server:
  port: 8084

spring:
  application:
    name: retailbank-account-service

  datasource:
    url: jdbc:postgresql://localhost:5432/retailbank_account_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: DEBUG